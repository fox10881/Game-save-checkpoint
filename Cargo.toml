[package]
name = "game-save-checkpoint"
version = "0.1.0"
edition = "2024"

[dependencies]
arabic_reshaper = "0.4.2"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
glob = "0.3.4"
ico = "0.6.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pelite = "0.10.0"
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9"
sha1 = "0.11.0"
shlex = "1.3.0"
unicode-bidi = "0.3.18"
ureq = "2"
walkdir = "2.5.0"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
ab_glyph = "0.2.32"
